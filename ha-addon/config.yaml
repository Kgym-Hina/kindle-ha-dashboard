name: Kindle HA Dashboard
version: "0.1.2"
slug: kindle_ha_dashboard
description: Home Assistant dashboard editor and JSON bridge for Kindle e-ink devices
url: https://github.com/Kgym-Hina/kindle-ha-dashboard
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:tablet-dashboard
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Editor API and standalone web access
options:
  ha_url: ""
  ha_token: ""
  port: 8099
schema:
  ha_url: str
  ha_token: password?
  port: port
